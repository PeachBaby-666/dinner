
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Inter:wght@300;400;500&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  #app {
    min-height: 520px;
    background: #0d0b14;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    border-radius: 12px;
    position: relative;
    overflow: hidden;
  }

  #app::before {
    content: '';
    position: absolute;
    top: -80px; left: -80px;
    width: 320px; height: 320px;
    background: radial-gradient(circle, rgba(120,80,200,0.18) 0%, transparent 70%);
    pointer-events: none;
  }
  #app::after {
    content: '';
    position: absolute;
    bottom: -60px; right: -60px;
    width: 260px; height: 260px;
    background: radial-gradient(circle, rgba(160,60,180,0.12) 0%, transparent 70%);
    pointer-events: none;
  }

  .screen { width: 100%; max-width: 500px; text-align: center; animation: fadeIn 0.4s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .eyebrow {
    font-family: 'Cinzel', serif;
    font-size: 11px;
    letter-spacing: 0.22em;
    color: #7c5bbf;
    text-transform: uppercase;
    margin-bottom: 1.2rem;
  }

  .question {
    font-family: 'Cinzel', serif;
    font-size: 26px;
    font-weight: 600;
    color: #e8e0f5;
    line-height: 1.3;
    margin-bottom: 2.5rem;
  }

  .btn-row {
    display: flex;
    gap: 14px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .btn {
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    font-weight: 500;
    padding: 14px 36px;
    border-radius: 8px;
    border: 1px solid;
    cursor: pointer;
    transition: all 0.18s ease;
    letter-spacing: 0.03em;
  }

  .btn-food {
    background: transparent;
    border-color: #6d3ebf;
    color: #c4a8f0;
  }
  .btn-food:hover {
    background: rgba(109,62,191,0.2);
    border-color: #9b68e8;
    color: #e0ccff;
  }

  .btn-other {
    background: rgba(255,255,255,0.04);
    border-color: #3d2a5e;
    color: #8a7aa8;
  }
  .btn-other:hover {
    background: rgba(255,255,255,0.08);
    border-color: #6d5090;
    color: #c4b8dc;
  }

  .rage-screen {
    animation: rageIn 0.3s cubic-bezier(0.36,0.07,0.19,0.97);
  }
  @keyframes rageIn {
    0% { transform: scale(0.85) rotate(-1deg); opacity: 0; }
    60% { transform: scale(1.04) rotate(0.5deg); }
    100% { transform: scale(1) rotate(0); opacity: 1; }
  }

  .rage-text {
    font-family: 'Cinzel', serif;
    font-size: clamp(20px, 5vw, 32px);
    font-weight: 600;
    color: #f0c0ff;
    line-height: 1.25;
    text-shadow: 0 0 40px rgba(180,80,220,0.4);
  }

  .rage-sub {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    color: #5c4878;
    margin-top: 1.5rem;
    letter-spacing: 0.05em;
  }

  .other-screen .prompt-label {
    font-family: 'Cinzel', serif;
    font-size: 16px;
    color: #c4a8f0;
    margin-bottom: 1.4rem;
    line-height: 1.5;
  }

  .other-screen textarea {
    width: 100%;
    background: rgba(255,255,255,0.04);
    border: 1px solid #3d2a5e;
    border-radius: 8px;
    color: #ddd0f5;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    padding: 14px 16px;
    resize: none;
    outline: none;
    transition: border-color 0.2s;
  }
  .other-screen textarea:focus {
    border-color: #7c5bbf;
  }
  .other-screen textarea::placeholder {
    color: #4a3a66;
  }

  .submit-btn {
    margin-top: 14px;
    background: rgba(109,62,191,0.15);
    border-color: #6d3ebf;
    color: #c4a8f0;
    width: 100%;
    padding: 13px;
  }
  .submit-btn:hover {
    background: rgba(109,62,191,0.28);
    border-color: #9b68e8;
    color: #e0ccff;
  }

  .final-screen .final-text {
    font-family: 'Cinzel', serif;
    font-size: 18px;
    color: #c4a8f0;
    margin-bottom: 0.6rem;
  }
  .final-screen .final-answer {
    font-family: 'Inter', sans-serif;
    font-size: 22px;
    font-weight: 500;
    color: #e8e0f5;
    margin-top: 0.8rem;
    padding: 14px 20px;
    background: rgba(255,255,255,0.05);
    border-radius: 8px;
    border: 1px solid #3d2a5e;
  }

  .divider {
    width: 40px;
    height: 1px;
    background: #3d2a5e;
    margin: 1.8rem auto;
  }
</style>

<div id="app">
  <div id="main" class="screen">
    <div class="eyebrow">the eternal question</div>
    <div class="question">What do you want<br>for dinner?</div>
    <div class="btn-row">
      <button class="btn btn-food" onclick="showRage()">Food</button>
      <button class="btn btn-other" onclick="showOther()">Other</button>
    </div>
  </div>
</div>

<script>
  function showRage() {
    document.getElementById('app').innerHTML = `
      <div class="screen rage-screen" style="text-align:center; max-width:500px;">
        <div class="rage-text">FUCK YOU —<br>I KNEW YOU'D<br>SELECT THAT ONE.</div>
        <div class="divider"></div>
        <div class="rage-sub">predictable as ever</div>
        <button class="btn btn-other" style="margin-top:2rem; font-size:13px; padding:10px 24px;" onclick="reset()">go back and redeem yourself</button>
      </div>
    `;
  }

  function showOther() {
    document.getElementById('app').innerHTML = `
      <div class="screen other-screen" style="max-width:480px;">
        <div class="prompt-label">Wow, look at you being<br>a responsible adult.<br><br>What do you actually feel like?</div>
        <textarea id="answer" rows="4" placeholder="type it out, champ..."></textarea>
        <button class="btn submit-btn" onclick="showFinal()">submit my grown-up answer</button>
      </div>
    `;
  }

  function showFinal() {
    const val = document.getElementById('answer').value.trim();
    if (!val) { document.getElementById('answer').style.borderColor = '#9b3080'; return; }
    document.getElementById('app').innerHTML = `
      <div class="screen final-screen" style="max-width:480px; text-align:center;">
        <div class="eyebrow">answer received</div>
        <div class="final-text">Noted. We're having:</div>
        <div class="final-answer">${val}</div>
        <div class="divider"></div>
        <div class="rage-sub">proud of you</div>
      </div>
    `;
  }

  function reset() {
    document.getElementById('app').innerHTML = `
      <div id="main" class="screen">
        <div class="eyebrow">the eternal question</div>
        <div class="question">What do you want<br>for dinner?</div>
        <div class="btn-row">
          <button class="btn btn-food" onclick="showRage()">Food</button>
          <button class="btn btn-other" onclick="showOther()">Other</button>
        </div>
      </div>
    `;
    attachEvents();
  }

  function attachEvents() {
    const f = document.querySelector('.btn-food');
    const o = document.querySelector('.btn-other');
    if(f) f.onclick = showRage;
    if(o) o.onclick = showOther;
  }
</script>
