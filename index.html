<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>What's for dinner?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      width: 100%;
      background: #0d0b14;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
    }

    #app {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      background: #0d0b14;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem;
      position: relative;
      overflow: hidden;
    }

    #app::before {
      content: '';
      position: absolute;
      top: -100px; left: -100px;
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(120,80,200,0.18) 0%, transparent 70%);
      pointer-events: none;
    }
    #app::after {
      content: '';
      position: absolute;
      bottom: -80px; right: -80px;
      width: 340px; height: 340px;
      background: radial-gradient(circle, rgba(160,60,180,0.12) 0%, transparent 70%);
      pointer-events: none;
    }

    .screen {
      width: 100%;
      max-width: 480px;
      text-align: center;
      animation: fadeIn 0.4s ease;
      position: relative;
      z-index: 1;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .eyebrow {
      font-family: 'Cinzel', serif;
      font-size: 11px;
      letter-spacing: 0.22em;
      color: #7c5bbf;
      text-transform: uppercase;
      margin-bottom: 1.4rem;
    }

    .question {
      font-family: 'Cinzel', serif;
      font-size: clamp(28px, 8vw, 38px);
      font-weight: 600;
      color: #e8e0f5;
      line-height: 1.3;
      margin-bottom: 3rem;
    }

    .btn-row {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      font-family: 'Inter', sans-serif;
      font-size: 17px;
      font-weight: 500;
      padding: 18px 44px;
      border-radius: 10px;
      border: 1px solid;
      cursor: pointer;
      transition: all 0.18s ease;
      letter-spacing: 0.03em;
      background: transparent;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .btn-food { border-color: #6d3ebf; color: #c4a8f0; }
    .btn-food:active { background: rgba(109,62,191,0.3); }

    .btn-other { border-color: #3d2a5e; color: #8a7aa8; background: rgba(255,255,255,0.04); }
    .btn-other:active { background: rgba(255,255,255,0.12); }

    .rage-screen { animation: rageIn 0.3s cubic-bezier(0.36,0.07,0.19,0.97); }
    @keyframes rageIn {
      0% { transform: scale(0.85) rotate(-1deg); opacity: 0; }
      60% { transform: scale(1.04) rotate(0.5deg); }
      100% { transform: scale(1) rotate(0); opacity: 1; }
    }

    .rage-text {
      font-family: 'Cinzel', serif;
      font-size: clamp(26px, 9vw, 42px);
      font-weight: 600;
      color: #f0c0ff;
      line-height: 1.25;
    }

    .rage-sub {
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      color: #5c4878;
      margin-top: 1.5rem;
      letter-spacing: 0.05em;
    }

    .prompt-label {
      font-family: 'Cinzel', serif;
      font-size: clamp(16px, 4.5vw, 20px);
      color: #c4a8f0;
      margin-bottom: 1.6rem;
      line-height: 1.6;
    }

    textarea {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid #3d2a5e;
      border-radius: 10px;
      color: #ddd0f5;
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      padding: 16px;
      resize: none;
      outline: none;
      transition: border-color 0.2s;
    }
    textarea:focus { border-color: #7c5bbf; }
    textarea::placeholder { color: #4a3a66; }

    .submit-btn {
      margin-top: 16px;
      border-color: #6d3ebf;
      color: #c4a8f0;
      width: 100%;
      padding: 18px;
      background: rgba(109,62,191,0.15);
      font-size: 16px;
    }
    .submit-btn:active { background: rgba(109,62,191,0.32); }

    .divider { width: 40px; height: 1px; background: #3d2a5e; margin: 2rem auto; }

    .final-note {
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      color: #5c4878;
      margin-top: 1rem;
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="screen">
      <div class="eyebrow">the eternal question</div>
      <div class="question">What do you want<br>for dinner?</div>
      <div class="btn-row">
        <button class="btn btn-food" onclick="showRage()">Food</button>
        <button class="btn btn-other" onclick="showOther()">I have actual thoughts</button>
      </div>
    </div>
  </div>

  <script>
    const recipientEmail = 'mikayla.emery@hotmail.com';

    function showRage() {
      document.getElementById('app').innerHTML = `
        <div class="screen rage-screen">
          <div class="rage-text">FUCK YOU —<br>I KNEW YOU'D<br>SELECT THAT ONE.</div>
          <div class="divider"></div>
          <div class="rage-sub">predictable as ever</div>
          <button class="btn btn-other" style="margin-top:2.5rem; font-size:14px; padding:14px 28px;" onclick="showMain()">go back and redeem yourself</button>
        </div>
      `;
    }

    function showMain() {
      document.getElementById('app').innerHTML = `
        <div class="screen">
          <div class="eyebrow">the eternal question</div>
          <div class="question">What do you want<br>for dinner?</div>
          <div class="btn-row">
            <button class="btn btn-food" onclick="showRage()">Food</button>
            <button class="btn btn-other" onclick="showOther()">I have actual thoughts</button>
          </div>
        </div>
      `;
    }

    function showOther() {
      document.getElementById('app').innerHTML = `
        <div class="screen">
          <div class="prompt-label">Wow, look at you being<br>a responsible adult.<br><br>What do you actually feel like?</div>
          <textarea id="answer" rows="4" placeholder="type it out, champ..."></textarea>
          <button class="btn submit-btn" onclick="sendAnswer()">send it</button>
        </div>
      `;
    }

    function sendAnswer() {
      const val = document.getElementById('answer').value.trim();
      if (!val) { document.getElementById('answer').style.borderColor = '#9b3080'; return; }

      const subject = encodeURIComponent('Dinner answer 🍽️');
      const body = encodeURIComponent('He has spoken.\n\n"' + val + '"\n\n— delivered via the dinner question');
      window.location.href = `mailto:${recipientEmail}?subject=${subject}&body=${body}`;

      document.getElementById('app').innerHTML = `
        <div class="screen" style="text-align:center;">
          <div class="eyebrow">answer sent</div>
          <div class="rage-text" style="font-size: clamp(20px, 6vw, 26px); color:#c4a8f0;">His answer is on its way.</div>
          <div class="divider"></div>
          <div class="final-note">his email app should have opened.<br>tell him to hit send.</div>
        </div>
      `;
    }
  </script>
</body>
</html>
